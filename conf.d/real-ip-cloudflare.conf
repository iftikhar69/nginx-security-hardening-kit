# real-ip-cloudflare.conf
#
# PROBLEM THIS FIXES:
# By default, NGINX trusts the X-Forwarded-For / CF-Connecting-IP header
# from ANY client. If your site sits behind Cloudflare but NGINX isn't
# told to only trust Cloudflare's actual edge IPs, an attacker can:
#   - Set their own CF-Connecting-IP / X-Forwarded-For header
#   - Bypass IP-based rate limiting and bans
#   - Poison your access logs with a fake source IP
#   - Defeat any security tooling that keys off $remote_addr
#
# This is a common, high-impact misconfiguration on Cloudflare + NGINX
# stacks that were set up quickly without hardening the trust boundary.
#
# FIX:
# Explicitly tell NGINX which IP ranges are allowed to set the real-IP
# header (Cloudflare's published edge ranges), and which header to trust.
# Requests NOT coming from these ranges have their header value ignored,
# and $remote_addr is used as-is.

# --- Cloudflare IPv4 ranges (verify against https://www.cloudflare.com/ips-v4 before deploying) ---
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# --- Cloudflare IPv6 ranges (verify against https://www.cloudflare.com/ips-v6 before deploying) ---
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# Use Cloudflare's own resolved-IP header (more reliable than X-Forwarded-For,
# which can contain a chain of proxies).
real_ip_header CF-Connecting-IP;

# If you must fall back to X-Forwarded-For instead, use this line and
# remove real_ip_header above — but CF-Connecting-IP is preferred:
# real_ip_header X-Forwarded-For;

# Allows NGINX to walk the chain if there are multiple trusted proxies.
real_ip_recursive on;

# --- Verification ---
# After deploying, confirm $remote_addr reflects the true client IP by
# checking access logs against a request from a known IP, and separately
# test that a forged CF-Connecting-IP header from a non-Cloudflare source
# is ignored (it should show the actual connecting IP, not the forged one).

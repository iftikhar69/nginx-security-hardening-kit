# bot-mitigation-map.conf
#
# PROBLEM THIS FIXES:
# Aggressive scrapers, vulnerability scanners, and scraping-as-a-service
# bots generate load, scrape pricing/content, and probe for weaknesses.
# Most never identify honestly — this blocks by known bad/abusive
# user-agent signatures, plus empty/suspicious user-agents commonly
# used by scripted attack tools.
#
# Include this file in your http{} block, then reference $bad_bot in
# each server{} block (see bottom of file for usage).

map $http_user_agent $bad_bot {
    default 0;

    # --- Aggressive SEO / content scrapers (heavy load, no business value for most sites) ---
    "~*SemrushBot"          1;
    "~*AhrefsBot"           1;
    "~*MJ12bot"             1;
    "~*DotBot"              1;
    "~*BLEXBot"             1;
    "~*PetalBot"            1;
    "~*Bytespider"          1;

    # --- Generic scripted HTTP clients often used in scraping/attack tooling ---
    "~*python-requests"     1;
    "~*python-urllib"       1;
    "~*Go-http-client"      1;
    "~*libwww-perl"         1;
    "~*Java/"               1;
    "~*Ruby"                1;
    "~*curl"                1;
    "~*Wget"                1;
    "~*scrapy"              1;

    # --- Known vulnerability scanners / recon tools (should never hit prod legitimately) ---
    "~*Nikto"               1;
    "~*sqlmap"              1;
    "~*nmap"                1;
    "~*masscan"             1;
    "~*zgrab"               1;
    "~*Nessus"              1;

    # --- Empty or clearly fake user-agents (common in scripted abuse) ---
    ""                      1;
    "-"                     1;
}

# --- Usage: add inside each server{} block you want protected ---
#
#   if ($bad_bot) {
#       return 403;
#   }
#
# NOTE ON if{} IN NGINX:
# `if` inside `location{}` is famously error-prone in NGINX. Placing it
# directly in `server{}` (as above, evaluated per-request before location
# matching) avoids the most common pitfalls. Test thoroughly in staging
# before relying on this in production, and check nginx -t after any edit.
#
# CAUTION:
# - Some entries above (curl, python-requests, Go-http-client) are also
#   used by legitimate uptime monitors, webhooks, and internal tooling.
#   Audit your own integrations before enabling and allowlist by IP or
#   a custom header if you rely on any of these.
# - This is signature-based blocking, not a substitute for rate limiting
#   (see woocommerce-abuse-protection.conf) — bots that spoof a normal
#   browser user-agent will bypass this entirely.

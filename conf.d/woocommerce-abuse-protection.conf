# woocommerce-abuse-protection.conf
#
# PROBLEM THIS FIXES:
# WordPress/WooCommerce sites expose several endpoints that are
# frequent targets for brute-force login attempts, XML-RPC abuse
# (used for DDoS amplification and brute force), and checkout/cart
# parameter flooding (bots hammering add-to-cart or wc-ajax endpoints,
# inflating server load and sometimes abusing coupon/pricing logic).
#
# FIX: rate-limit these specific endpoints instead of the whole site,
# so real customers checking out normally are unaffected.

# --- Define rate limit zones (place in http{} block) ---
limit_req_zone $binary_remote_addr zone=wp_login:10m   rate=5r/m;
limit_req_zone $binary_remote_addr zone=xmlrpc:10m     rate=2r/m;
limit_req_zone $binary_remote_addr zone=wc_ajax:10m    rate=30r/m;
limit_req_zone $binary_remote_addr zone=admin_ajax:10m rate=60r/m;

# --- Apply inside server{} block ---

# wp-login.php: brute-force login protection
location = /wp-login.php {
    limit_req zone=wp_login burst=3 nodelay;
    limit_req_status 429;
    try_files $uri =404;
    fastcgi_pass unix:/var/run/php/php-fpm.sock;   # adjust to your PHP-FPM socket
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
}

# xmlrpc.php: block entirely unless you specifically need it
# (Jetpack, some mobile apps, and pingbacks use this — most sites don't need it)
location = /xmlrpc.php {
    limit_req zone=xmlrpc burst=1 nodelay;
    limit_req_status 429;
    # Uncomment to block entirely instead of rate-limiting:
    # deny all;
    try_files $uri =404;
    fastcgi_pass unix:/var/run/php/php-fpm.sock;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
}

# wc-ajax: WooCommerce's ajax endpoint (add-to-cart, update-cart, apply_coupon, etc.)
# Rate-limited, not blocked — real shoppers use this constantly.
location ~ ^/(.*)/?\?wc-ajax= {
    limit_req zone=wc_ajax burst=10 nodelay;
    limit_req_status 429;
    try_files $uri $uri/ /index.php?$args;
}

# admin-ajax.php: used by WooCommerce, WordPress core, and most plugins.
# Rate-limited generously since this is high-traffic on any active store.
location = /wp-admin/admin-ajax.php {
    limit_req zone=admin_ajax burst=20 nodelay;
    limit_req_status 429;
    try_files $uri =404;
    fastcgi_pass unix:/var/run/php/php-fpm.sock;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
}

# --- Notes ---
# - Tune the `rate=` values to your real traffic; these are conservative
#   starting points, not universal constants. Watch your error logs for
#   429s from legitimate customers after deploying and adjust up if needed.
# - `limit_req_status 429` returns a proper "Too Many Requests" instead of
#   NGINX's default 503, which is more accurate and less likely to trip
#   uptime monitors into false alarms.
# - This complements, not replaces, application-level protections
#   (login attempt limiting plugins, WooCommerce fraud rules, a WAF).
